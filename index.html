<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>iPhone 給料計算 & 勤怠解析</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="給与計算">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3135/3135706.png">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Tesseract.js (OCR Fallback) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

  <style>
    /* iOS Safe Area Padding Support */
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(env(safe-area-inset-bottom) + 70px);
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .pb-safe {
      padding-bottom: calc(env(safe-area-inset-bottom) + 80px);
    }
    .pt-safe {
      padding-top: env(safe-area-inset-top);
    }
    /* Disable auto zoom on inputs in iOS */
    input, select, textarea {
      font-size: 16px !important;
    }
    /* Custom Scrollbar hide */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

  <!-- Header -->
  <header class="bg-blue-600 text-white sticky top-0 z-30 shadow-md pt-safe">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-lg font-bold flex items-center gap-2">
        <i class="fa-solid me-1 fa-calculator"></i> スマホ給与計算
      </h1>
      <span id="savedBadge" class="text-xs bg-blue-700 text-blue-100 px-2.5 py-1 rounded-full flex items-center gap-1 transition-opacity duration-300 opacity-100">
        <i class="fa-solid fa-cloud-arrow-up"></i> 設定自動保存中
      </span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 pt-4 pb-safe">

    <!-- View 1: Summary View -->
    <section id="view-summary" class="space-y-4">
      <!-- Total Salary Card -->
      <div class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-2xl p-5 text-white shadow-lg relative overflow-hidden">
        <div class="absolute -right-4 -bottom-4 opacity-10 text-8xl">
          <i class="fa-solid fa-sack-dollar"></i>
        </div>
        <p class="text-xs font-medium text-blue-100 tracking-wider">推定概算支給額</p>
        <div class="flex items-baseline gap-1 mt-1">
          <span class="text-3xl font-extrabold tracking-tight" id="totalSalaryDisplay">¥0</span>
          <span class="text-xs text-blue-200">(税込・各種手当込)</span>
        </div>

        <div class="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-blue-400/30 text-center text-xs">
          <div>
            <p class="text-blue-200">実働時間</p>
            <p class="font-bold text-sm mt-0.5" id="totalHoursDisplay">0時間 0分</p>
          </div>
          <div>
            <p class="text-blue-200">出勤日数</p>
            <p class="font-bold text-sm mt-0.5" id="totalDaysDisplay">0日</p>
          </div>
          <div>
            <p class="text-blue-200">交通費(月額)</p>
            <p class="font-bold text-sm mt-0.5" id="transportationDisplay">¥0</p>
          </div>
        </div>
      </div>

      <!-- Salary Breakdown Breakdown -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center justify-between">
          <span><i class="fa-solid fa-chart-pie text-blue-500 mr-1.5"></i>給与内訳</span>
        </h3>
        <div class="relative h-48">
          <canvas id="salaryChart"></canvas>
        </div>
        <div class="grid grid-cols-2 gap-2 mt-4 text-xs">
          <div class="flex justify-between items-center p-2 bg-slate-50 rounded-lg">
            <span class="text-slate-600"><span class="inline-block w-2.5 h-2.5 rounded-full bg-blue-500 mr-1"></span>基本給:</span>
            <span class="font-semibold text-slate-800" id="basePayDisplay">¥0</span>
          </div>
          <div class="flex justify-between items-center p-2 bg-slate-50 rounded-lg">
            <span class="text-slate-600"><span class="inline-block w-2.5 h-2.5 rounded-full bg-indigo-500 mr-1"></span>深夜手当:</span>
            <span class="font-semibold text-slate-800" id="nightPayDisplay">¥0</span>
          </div>
          <div class="flex justify-between items-center p-2 bg-slate-50 rounded-lg">
            <span class="text-slate-600"><span class="inline-block w-2.5 h-2.5 rounded-full bg-orange-400 mr-1"></span>残業手当:</span>
            <span class="font-semibold text-slate-800" id="overtimePayDisplay">¥0</span>
          </div>
          <div class="flex justify-between items-center p-2 bg-slate-50 rounded-lg">
            <span class="text-slate-600"><span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 mr-1"></span>土日祝/特別手当:</span>
            <span class="font-semibold text-slate-800" id="holidayPayDisplay">¥0</span>
          </div>
        </div>
      </div>

      <!-- Upload Trigger Section -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 text-center">
        <p class="text-xs text-slate-500 mb-3">勤怠アプリのスクリーンショットから自動一括読み込み</p>
        <label for="imageInput" class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3 px-4 rounded-xl shadow cursor-pointer flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-camera text-lg"></i>
          <span>スクリーンショットを解析</span>
        </label>
        <input type="file" id="imageInput" accept="image/*" class="hidden">
      </div>
    </section>

    <!-- View 2: Shift List & Manual Input -->
    <section id="view-shifts" class="space-y-4 hidden">
      <!-- Add Shift Controls -->
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
        <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-1.5">
          <i class="fa-solid fa-plus-circle text-blue-500"></i>
          <span>シフトを直接追加・確定</span>
        </h3>
        
        <div class="space-y-3">
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs font-semibold text-slate-500 block mb-1">日付</label>
              <input type="date" id="newShiftDate" class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-slate-50">
            </div>
            <div>
              <label class="text-xs font-semibold text-slate-500 block mb-1">区分</label>
              <select id="newShiftType" class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-slate-50">
                <option value="出勤">出勤</option>
                <option value="有給">有給</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="text-xs font-semibold text-slate-500 block mb-1">開始時間</label>
              <input type="time" id="newShiftStart" value="09:00" class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-slate-50">
            </div>
            <div>
              <label class="text-xs font-semibold text-slate-500 block mb-1">終了時間</label>
              <input type="time" id="newShiftEnd" value="18:00" class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-slate-50">
            </div>
            <div>
              <label class="text-xs font-semibold text-slate-500 block mb-1">休憩(分)</label>
              <input type="number" id="newShiftBreak" value="60" min="0" step="5" class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-slate-50">
            </div>
          </div>

          <button id="addShiftConfirmBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl shadow flex items-center justify-center gap-2 text-sm active:scale-95 transition">
            <i class="fa-solid fa-check-circle text-base"></i>
            <span>このシフト内容で確定保存</span>
          </button>
        </div>
      </div>

      <!-- Shift Item Cards -->
      <div class="flex justify-between items-center px-1">
        <h3 class="text-xs font-bold text-slate-500 uppercase tracking-wider">登録済みシフト一覧 (<span id="shiftCountDisplay">0</span>件)</h3>
        <button id="clearAllShiftsBtn" class="text-xs text-red-500 hover:underline">全消去</button>
      </div>

      <div id="shiftListContainer" class="space-y-2.5">
        <!-- Dynamic Shift Cards rendered via JS -->
      </div>
    </section>

    <!-- View 3: Settings -->
    <section id="view-settings" class="space-y-4 hidden">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-4">
        <div class="flex items-center justify-between border-b pb-3">
          <h3 class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
            <i class="fa-solid fa-sliders text-blue-500"></i>
            <span>給与・手当の設定</span>
          </h3>
          <span class="text-xs text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-200">
            <i class="fa-solid fa-check text-xs"></i> 保存済み
          </span>
        </div>

        <!-- Base Wage & Monthly Transport -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-semibold text-slate-600 block mb-1">基本時給 (円)</label>
            <div class="relative">
              <input type="number" id="settingBaseWage" value="1200" class="w-full border border-slate-300 rounded-lg p-2 text-sm pl-7 font-bold">
              <span class="absolute left-2.5 top-2 text-slate-400 text-sm">¥</span>
            </div>
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-600 block mb-1">月額交通費 (円)</label>
            <div class="relative">
              <input type="number" id="settingTransport" value="10000" class="w-full border border-slate-300 rounded-lg p-2 text-sm pl-7 font-bold">
              <span class="absolute left-2.5 top-2 text-slate-400 text-sm">¥</span>
            </div>
            <p class="text-[10px] text-slate-400 mt-0.5">※1日以上の出勤で適用</p>
          </div>
        </div>

        <!-- Weekend / Holiday Allowance -->
        <div class="pt-2 border-t border-slate-100">
          <p class="text-xs font-bold text-slate-700 mb-2">土日祝・時給手当 (+円/時)</p>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs text-slate-500 block mb-1">土曜日加算</label>
              <div class="relative">
                <input type="number" id="settingSatBonus" value="100" class="w-full border border-slate-300 rounded-lg p-2 text-sm pl-7">
                <span class="absolute left-2.5 top-2 text-slate-400 text-sm">+</span>
              </div>
            </div>
            <div>
              <label class="text-xs text-slate-500 block mb-1">日祝日加算</label>
              <div class="relative">
                <input type="number" id="settingSunBonus" value="150" class="w-full border border-slate-300 rounded-lg p-2 text-sm pl-7">
                <span class="absolute left-2.5 top-2 text-slate-400 text-sm">+</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Special Period Allowance (Obon, New Year, etc) -->
        <div class="pt-2 border-t border-slate-100 space-y-3">
          <div class="flex justify-between items-center">
            <p class="text-xs font-bold text-slate-700">特別期間手当 (お盆・正月等)</p>
            <button id="addSpecialPeriodBtn" class="text-xs text-blue-600 font-semibold hover:underline flex items-center gap-1">
              <i class="fa-solid fa-plus"></i> 期間を追加
            </button>
          </div>

          <div id="specialPeriodsList" class="space-y-2">
            <!-- Dynamic Period Rows -->
          </div>
        </div>

        <!-- Reset Button -->
        <div class="pt-3 border-t border-slate-100">
          <button id="resetSettingsBtn" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-2 rounded-lg text-xs transition">
            初期設定にリセット
          </button>
        </div>
      </div>
    </section>

  </main>

  <!-- iOS Fixed Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-40 pb-safe">
    <div class="max-w-md mx-auto grid grid-cols-3 h-14">
      <button id="nav-summary" class="nav-btn text-blue-600 flex flex-col items-center justify-center gap-0.5">
        <i class="fa-solid fa-chart-line text-lg"></i>
        <span class="text-[10px] font-medium">サマリー</span>
      </button>
      <button id="nav-shifts" class="nav-btn text-slate-400 flex flex-col items-center justify-center gap-0.5">
        <i class="fa-solid fa-calendar-days text-lg"></i>
        <span class="text-[10px] font-medium">シフト詳細</span>
      </button>
      <button id="nav-settings" class="nav-btn text-slate-400 flex flex-col items-center justify-center gap-0.5">
        <i class="fa-solid fa-gear text-lg"></i>
        <span class="text-[10px] font-medium">給与設定</span>
      </button>
    </div>
  </nav>

  <!-- Modal Parsing Spinner -->
  <div id="loadingModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-2xl p-6 max-w-xs w-full text-center shadow-xl space-y-4">
      <div class="inline-block p-4 bg-blue-50 text-blue-600 rounded-full animate-bounce">
        <i class="fa-solid fa-microchip text-3xl"></i>
      </div>
      <div>
        <h4 class="font-bold text-slate-800 text-base">画像を自動解析中</h4>
        <p class="text-xs text-slate-500 mt-1" id="loadingStatusText">画像を読み込み、勤務時間を計算しています...</p>
      </div>
      <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
        <div class="bg-blue-600 h-full w-2/3 animate-pulse"></div>
      </div>
    </div>
  </div>

  <script>
    // Global Application State & Storage Key
    const STORAGE_KEY_SETTINGS = 'payroll_app_settings_v1';
    const STORAGE_KEY_SHIFTS = 'payroll_app_shifts_v1';

    // Default Settings
    const defaultSettings = {
      baseWage: 1200,
      monthlyTransport: 10000,
      satBonus: 100,
      sunBonus: 150,
      specialPeriods: [
        { id: 'p1', name: 'お盆手当', start: '2026-08-12', end: '2026-08-16', bonus: 300 },
        { id: 'p2', name: '正月手当', start: '2026-12-30', end: '2027-01-03', bonus: 500 }
      ]
    };

    let settings = loadSettings();
    let shifts = loadShifts();
    let salaryChart = null;

    // Load Settings from LocalStorage
    function loadSettings() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY_SETTINGS);
        return saved ? { ...defaultSettings, ...JSON.parse(saved) } : { ...defaultSettings };
      } catch (e) {
        return { ...defaultSettings };
      }
    }

    // Save Settings to LocalStorage
    function saveSettings() {
      try {
        localStorage.setItem(STORAGE_KEY_SETTINGS, JSON.stringify(settings));
        showSavedIndicator();
      } catch (e) {
        console.error('Storage save error:', e);
      }
    }

    // Load Shifts from LocalStorage
    function loadShifts() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY_SHIFTS);
        return saved ? JSON.parse(saved) : [];
      } catch (e) {
        return [];
      }
    }

    // Save Shifts to LocalStorage
    function saveShifts() {
      try {
        localStorage.setItem(STORAGE_KEY_SHIFTS, JSON.stringify(shifts));
      } catch (e) {
        console.error('Storage save error:', e);
      }
    }

    function showSavedIndicator() {
      const badge = document.getElementById('savedBadge');
      if(badge) {
        badge.classList.remove('opacity-0');
        badge.classList.add('opacity-100');
        setTimeout(() => {
          badge.classList.remove('opacity-100');
          badge.classList.add('opacity-80');
        }, 1000);
      }
    }

    // Initialize App
    document.addEventListener('DOMContentLoaded', () => {
      initNavigation();
      initSettingsInputs();
      initChart();
      renderSpecialPeriodsUI();
      renderShiftList();
      recalculateAll();

      // Today default for date picker
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('newShiftDate').value = today;

      // Event Listeners
      document.getElementById('imageInput').addEventListener('change', handleImageUpload);
      document.getElementById('addShiftConfirmBtn').addEventListener('click', handleManualShiftAdd);
      document.getElementById('addSpecialPeriodBtn').addEventListener('click', handleAddSpecialPeriod);
      document.getElementById('clearAllShiftsBtn').addEventListener('click', handleClearAllShifts);
      document.getElementById('resetSettingsBtn').addEventListener('click', handleResetSettings);
    });

    // Navigation Switcher
    function initNavigation() {
      const navBtns = {
        summary: document.getElementById('nav-summary'),
        shifts: document.getElementById('nav-shifts'),
        settings: document.getElementById('nav-settings')
      };

      const views = {
        summary: document.getElementById('view-summary'),
        shifts: document.getElementById('view-shifts'),
        settings: document.getElementById('view-settings')
      };

      function switchView(target) {
        Object.keys(views).forEach(key => {
          if (key === target) {
            views[key].classList.remove('hidden');
            navBtns[key].classList.add('text-blue-600');
            navBtns[key].classList.remove('text-slate-400');
          } else {
            views[key].classList.add('hidden');
            navBtns[key].classList.remove('text-blue-600');
            navBtns[key].classList.add('text-slate-400');
          }
        });
      }

      navBtns.summary.addEventListener('click', () => switchView('summary'));
      navBtns.shifts.addEventListener('click', () => switchView('shifts'));
      navBtns.settings.addEventListener('click', () => switchView('settings'));
    }

    // Bind settings fields to storage
    function initSettingsInputs() {
      const baseWageInput = document.getElementById('settingBaseWage');
      const transportInput = document.getElementById('settingTransport');
      const satBonusInput = document.getElementById('settingSatBonus');
      const sunBonusInput = document.getElementById('settingSunBonus');

      baseWageInput.value = settings.baseWage;
      transportInput.value = settings.monthlyTransport;
      satBonusInput.value = settings.satBonus;
      sunBonusInput.value = settings.sunBonus;

      const updateSettings = () => {
        settings.baseWage = Number(baseWageInput.value) || 0;
        settings.monthlyTransport = Number(transportInput.value) || 0;
        settings.satBonus = Number(satBonusInput.value) || 0;
        settings.sunBonus = Number(sunBonusInput.value) || 0;
        saveSettings();
        recalculateAll();
      };

      [baseWageInput, transportInput, satBonusInput, sunBonusInput].forEach(input => {
        input.addEventListener('input', updateSettings);
      });
    }

    // Render Special Periods UI
    function renderSpecialPeriodsUI() {
      const container = document.getElementById('specialPeriodsList');
      container.innerHTML = '';

      if (settings.specialPeriods.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-400 text-center py-2">特別手当期間は設定されていません</p>`;
        return;
      }

      settings.specialPeriods.forEach((period, idx) => {
        const row = document.createElement('div');
        row.className = 'bg-slate-50 border border-slate-200 rounded-xl p-2.5 space-y-2';
        row.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <input type="text" value="${period.name}" placeholder="手当名" class="period-name text-xs font-bold border border-slate-300 rounded px-2 py-1 w-1/2" data-idx="${idx}">
            <div class="flex items-center gap-1 w-1/2 justify-end">
              <span class="text-xs text-slate-400">+¥</span>
              <input type="number" value="${period.bonus}" placeholder="加算" class="period-bonus text-xs font-bold border border-slate-300 rounded px-2 py-1 w-20 text-right" data-idx="${idx}">
              <button class="delete-period-btn text-red-400 hover:text-red-600 p-1 ml-1" data-idx="${idx}">
                <i class="fa-solid fa-trash-can text-xs"></i>
              </button>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <div>
              <span class="text-[10px] text-slate-400 block">開始日</span>
              <input type="date" value="${period.start}" class="period-start w-full border border-slate-300 rounded px-1.5 py-0.5 text-xs bg-white" data-idx="${idx}">
            </div>
            <div>
              <span class="text-[10px] text-slate-400 block">終了日</span>
              <input type="date" value="${period.end}" class="period-end w-full border border-slate-300 rounded px-1.5 py-0.5 text-xs bg-white" data-idx="${idx}">
            </div>
          </div>
        `;
        container.appendChild(row);
      });

      // Event listeners for inputs
      container.querySelectorAll('.period-name').forEach(el => {
        el.addEventListener('change', e => {
          const idx = e.target.dataset.idx;
          settings.specialPeriods[idx].name = e.target.value;
          saveSettings();
          recalculateAll();
        });
      });

      container.querySelectorAll('.period-bonus').forEach(el => {
        el.addEventListener('change', e => {
          const idx = e.target.dataset.idx;
          settings.specialPeriods[idx].bonus = Number(e.target.value) || 0;
          saveSettings();
          recalculateAll();
        });
      });

      container.querySelectorAll('.period-start').forEach(el => {
        el.addEventListener('change', e => {
          const idx = e.target.dataset.idx;
          settings.specialPeriods[idx].start = e.target.value;
          saveSettings();
          recalculateAll();
        });
      });

      container.querySelectorAll('.period-end').forEach(el => {
        el.addEventListener('change', e => {
          const idx = e.target.dataset.idx;
          settings.specialPeriods[idx].end = e.target.value;
          saveSettings();
          recalculateAll();
        });
      });

      container.querySelectorAll('.delete-period-btn').forEach(el => {
        el.addEventListener('click', e => {
          const idx = e.currentTarget.dataset.idx;
          settings.specialPeriods.splice(idx, 1);
          saveSettings();
          renderSpecialPeriodsUI();
          recalculateAll();
        });
      });
    }

    function handleAddSpecialPeriod() {
      const newId = 'p_' + Date.now();
      const today = new Date().toISOString().split('T')[0];
      settings.specialPeriods.push({
        id: newId,
        name: '特別手当',
        start: today,
        end: today,
        bonus: 200
      });
      saveSettings();
      renderSpecialPeriodsUI();
      recalculateAll();
    }

    function handleResetSettings() {
      if (confirm('給与・手当の設定を初期状態に戻しますか？')) {
        settings = JSON.parse(JSON.stringify(defaultSettings));
        saveSettings();
        initSettingsInputs();
        renderSpecialPeriodsUI();
        recalculateAll();
      }
    }

    // Chart Initialization
    function initChart() {
      const ctx = document.getElementById('salaryChart').getContext('2d');
      salaryChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['基本給', '深夜手当', '残業手当', '休日・特別手当'],
          datasets: [{
            data: [0, 0, 0, 0],
            backgroundColor: ['#3b82f6', '#6366f1', '#fb923c', '#10b981'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          cutout: '70%'
        }
      });
    }

    // Shift Calculations
    function recalculateAll() {
      let totalHours = 0;
      let workDaysCount = 0;
      let basePay = 0;
      let nightPay = 0;
      let overtimePay = 0;
      let holidaySpecialPay = 0;

      shifts.forEach(shift => {
        if (shift.type !== '出勤' || !shift.start || !shift.end) return;

        workDaysCount++;
        const calc = computeShiftPay(shift);
        totalHours += calc.workMinutes / 60;
        basePay += calc.basePay;
        nightPay += calc.nightPay;
        overtimePay += calc.overtimePay;
        holidaySpecialPay += calc.holidayBonusPay + calc.specialPeriodPay;
      });

      const transportPay = workDaysCount > 0 ? settings.monthlyTransport : 0;
      const grandTotal = basePay + nightPay + overtimePay + holidaySpecialPay + transportPay;

      // Update DOM
      document.getElementById('totalSalaryDisplay').innerText = `¥${grandTotal.toLocaleString()}`;
      document.getElementById('totalHoursDisplay').innerText = `${Math.floor(totalHours)}時間 ${Math.round((totalHours % 1) * 60)}分`;
      document.getElementById('totalDaysDisplay').innerText = `${workDaysCount}日`;
      document.getElementById('transportationDisplay').innerText = `¥${transportPay.toLocaleString()}`;

      document.getElementById('basePayDisplay').innerText = `¥${Math.round(basePay).toLocaleString()}`;
      document.getElementById('nightPayDisplay').innerText = `¥${Math.round(nightPay).toLocaleString()}`;
      document.getElementById('overtimePayDisplay').innerText = `¥${Math.round(overtimePay).toLocaleString()}`;
      document.getElementById('holidayPayDisplay').innerText = `¥${Math.round(holidaySpecialPay).toLocaleString()}`;

      document.getElementById('shiftCountDisplay').innerText = shifts.length;

      // Update Chart
      if (salaryChart) {
        salaryChart.data.datasets[0].data = [
          Math.round(basePay),
          Math.round(nightPay),
          Math.round(overtimePay),
          Math.round(holidaySpecialPay)
        ];
        salaryChart.update();
      }
    }

    // Single Shift Pay Calculator
    function computeShiftPay(shift) {
      const [sh, sm] = shift.start.split(':').map(Number);
      const [eh, em] = shift.end.split(':').map(Number);

      let startMins = sh * 60 + sm;
      let endMins = eh * 60 + em;
      if (endMins <= startMins) endMins += 24 * 60; // Overnight

      const totalMins = endMins - startMins;
      const breakMins = Number(shift.breakMins) || 0;
      const workMins = Math.max(0, totalMins - breakMins);
      const workHours = workMins / 60;

      // Date parsing
      const dateObj = new Date(shift.date);
      const dayOfWeek = dateObj.getDay(); // 0: Sun, 6: Sat

      // Check Holiday Bonus (+yen/hr)
      let hourlyBonus = 0;
      let dayBadge = '';
      if (dayOfWeek === 6) {
        hourlyBonus += settings.satBonus;
        dayBadge = '土曜加算';
      } else if (dayOfWeek === 0) {
        hourlyBonus += settings.sunBonus;
        dayBadge = '日祝加算';
      }

      // Check Special Period Bonus
      let specialBonusHourly = 0;
      let specialBadge = '';
      const shiftDateStr = shift.date; // YYYY-MM-DD
      for (const period of settings.specialPeriods) {
        if (shiftDateStr >= period.start && shiftDateStr <= period.end) {
          specialBonusHourly += period.bonus;
          specialBadge = period.name;
          break;
        }
      }

      const effectiveBaseRate = settings.baseWage + hourlyBonus + specialBonusHourly;
      const basePay = workHours * settings.baseWage;

      // Night Hours Calculation (22:00 ~ 05:00)
      let nightMins = 0;
      for (let m = startMins; m < endMins - breakMins; m++) {
        const hourInDay = Math.floor(m / 60) % 24;
        if (hourInDay >= 22 || hourInDay < 5) {
          nightMins++;
        }
      }
      const nightPay = (nightMins / 60) * (effectiveBaseRate * 0.25);

      // Daily Overtime Calculation (> 8 hours)
      const overtimeMins = Math.max(0, workMins - 8 * 60);
      const overtimePay = (overtimeMins / 60) * (effectiveBaseRate * 0.25);

      const holidayBonusPay = workHours * hourlyBonus;
      const specialPeriodPay = workHours * specialBonusHourly;

      return {
        workMinutes: workMins,
        basePay,
        nightPay,
        overtimePay,
        holidayBonusPay,
        specialPeriodPay,
        dayBadge,
        specialBadge
      };
    }

    // Render Shift List with Confirmation Check Button
    function renderShiftList() {
      const container = document.getElementById('shiftListContainer');
      container.innerHTML = '';

      if (shifts.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center text-slate-400 border border-slate-200">
            <i class="fa-regular fa-calendar-xmark text-4xl mb-2 text-slate-300"></i>
            <p class="text-xs">シフトデータが登録されていません</p>
          </div>`;
        return;
      }

      // Sort shifts by date descending
      shifts.sort((a, b) => new Date(b.date) - new Date(a.date));

      shifts.forEach((shift, index) => {
        const calc = computeShiftPay(shift);
        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200 space-y-3 relative';

        // Draft state tracker for inputs
        card.innerHTML = `
          <div class="flex items-center justify-between border-b pb-2">
            <div class="flex items-center gap-2">
              <input type="date" value="${shift.date}" class="shift-date-input text-xs font-bold text-slate-700 bg-slate-50 border border-slate-200 rounded px-2 py-1">
              ${calc.dayBadge ? `<span class="text-[10px] bg-amber-100 text-amber-700 font-bold px-1.5 py-0.5 rounded">${calc.dayBadge}</span>` : ''}
              ${calc.specialBadge ? `<span class="text-[10px] bg-rose-100 text-rose-700 font-bold px-1.5 py-0.5 rounded">${calc.specialBadge}</span>` : ''}
            </div>
            <button class="delete-shift-btn text-slate-400 hover:text-red-500 p-1" data-index="${index}">
              <i class="fa-solid fa-trash-can text-sm"></i>
            </button>
          </div>

          <div class="grid grid-cols-3 gap-2 text-xs">
            <div>
              <span class="text-[10px] text-slate-400 block mb-0.5">開始時間</span>
              <input type="time" value="${shift.start}" class="shift-start-input w-full border border-slate-200 bg-slate-50 rounded px-1.5 py-1 text-xs font-semibold">
            </div>
            <div>
              <span class="text-[10px] text-slate-400 block mb-0.5">終了時間</span>
              <input type="time" value="${shift.end}" class="shift-end-input w-full border border-slate-200 bg-slate-50 rounded px-1.5 py-1 text-xs font-semibold">
            </div>
            <div>
              <span class="text-[10px] text-slate-400 block mb-0.5">休憩(分)</span>
              <input type="number" value="${shift.breakMins}" min="0" step="5" class="shift-break-input w-full border border-slate-200 bg-slate-50 rounded px-1.5 py-1 text-xs font-semibold">
            </div>
          </div>

          <div class="flex items-center justify-between pt-1 text-xs">
            <div class="text-slate-500">
              実働: <span class="font-bold text-slate-700">${Math.floor(calc.workMinutes/60)}h ${calc.workMinutes%60}m</span>
            </div>
            <div class="flex items-center gap-2">
              <button class="confirm-shift-btn bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold px-3 py-1.5 rounded-lg text-xs flex items-center gap-1 shadow-sm transition" data-index="${index}">
                <i class="fa-solid fa-check"></i>
                <span>確定</span>
              </button>
            </div>
          </div>
        `;

        container.appendChild(card);
      });

      // Bind Row Event Listeners
      container.querySelectorAll('.confirm-shift-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          const idx = e.currentTarget.dataset.index;
          const card = e.currentTarget.closest('.bg-white');
          
          const newDate = card.querySelector('.shift-date-input').value;
          const newStart = card.querySelector('.shift-start-input').value;
          const newEnd = card.querySelector('.shift-end-input').value;
          const newBreak = Number(card.querySelector('.shift-break-input').value) || 0;

          shifts[idx].date = newDate;
          shifts[idx].start = newStart;
          shifts[idx].end = newEnd;
          shifts[idx].breakMins = newBreak;

          saveShifts();
          renderShiftList();
          recalculateAll();

          // Quick toast/feedback
          e.currentTarget.classList.add('bg-emerald-700');
          setTimeout(() => renderShiftList(), 200);
        });
      });

      container.querySelectorAll('.delete-shift-btn').forEach(btn => {
        btn.addEventListener('click', e => {
          const idx = e.currentTarget.dataset.index;
          shifts.splice(idx, 1);
          saveShifts();
          renderShiftList();
          recalculateAll();
        });
      });
    }

    // Manual Add Shift Handler
    function handleManualShiftAdd() {
      const date = document.getElementById('newShiftDate').value;
      const type = document.getElementById('newShiftType').value;
      const start = document.getElementById('newShiftStart').value;
      const end = document.getElementById('newShiftEnd').value;
      const breakMins = Number(document.getElementById('newShiftBreak').value) || 0;

      if (!date) {
        alert('日付を選択してください');
        return;
      }

      shifts.push({ date, type, start, end, breakMins });
      saveShifts();
      renderShiftList();
      recalculateAll();

      // Clear input button animation
      const btn = document.getElementById('addShiftConfirmBtn');
      btn.classList.add('bg-emerald-800');
      setTimeout(() => btn.classList.remove('bg-emerald-800'), 300);
    }

    function handleClearAllShifts() {
      if (confirm('登録されているすべてのシフトデータを削除しますか？')) {
        shifts = [];
        saveShifts();
        renderShiftList();
        recalculateAll();
      }
    }

  </script>
